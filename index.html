 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVAIDE | Necklaces Collection</title>
    <style>
        body { font-family: 'Helvetica Neue', sans-serif; margin: 0; background-color: #fff; color: #1a1a1a; }
        
        /* Professional Header */
        header { padding: 20px; text-align: center; border-bottom: 1px solid #f0f0f0; background: #fff; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 26px; font-weight: bold; letter-spacing: 6px; color: #001f3f; text-transform: uppercase; }

        /* Navigation Menu */
        nav.main-menu { display: flex; justify-content: center; gap: 30px; padding: 15px 0; border-bottom: 1px solid #f9f9f9; font-size: 13px; font-weight: 600; letter-spacing: 1px; }
        nav.main-menu a { text-decoration: none; color: #555; text-transform: uppercase; }
        nav.main-menu a.active { color: #001f3f; border-bottom: 2px solid #001f3f; padding-bottom: 5px; }

        /* Category Header */
        .category-info { text-align: center; padding: 40px 20px; background: #fafafa; }
        .category-info h1 { font-size: 22px; font-weight: 400; letter-spacing: 3px; margin: 0; }
        .category-info p { font-size: 12px; color: #888; margin-top: 10px; }

        /* Professional Product Grid */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }

        .product-card { background: #fff; text-align: left; position: relative; }
        .product-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #f4f4f4; border-radius: 4px; }
        
        .product-details { padding: 12px 5px; }
        .product-tag { font-size: 10px; color: #bca05d; font-weight: bold; margin-bottom: 5px; display: block; }
        .product-title { font-size: 14px; font-weight: 500; margin: 0; color: #222; }
        
        .price-box { margin-top: 8px; font-size: 15px; }
        .old-price { text-decoration: line-through; color: #999; font-size: 13px; margin-right: 8px; }
        .new-price { font-weight: 700; color: #000; }

        /* Floating WhatsApp Button */
        .buy-btn { display: block; width: 100%; background: #001f3f; color: #fff; text-align: center; padding: 10px 0; text-decoration: none; font-size: 12px; font-weight: 600; margin-top: 10px; border-radius: 2px; }

        @media (min-width: 768px) { .product-grid { grid-template-columns: repeat(3, 1fr); gap: 40px; } }
    </style>
</head>
<body>

<header>
    <div class="logo">BVAIDE</div>
</header>

<nav class="main-menu">
    <a href="#">Rings</a>
    <a href="#">Earrings</a>
    <a href="#" class="active">Necklaces</a>
    <a href="#">Bracelets</a>
</nav>

<div class="category-info">
    <h1>NECKLACES</h1>
    <p>Elegant designs for every occasion</p>
</div>

<div class="container">
    <div class="product-grid">
        
        <div class="product-card">
            <span class="product-tag">BEST SELLER</span>
            <img src="https://i.ibb.co/XRs6Z7V/1000260606.jpg" alt="Pearl & Heart Duo">
            <div class="product-details">
                <h3 class="product-title">Pearl & Heart Duo</h3>
                <div class="price-box">
                    <span class="old-price">₹599</span>
                    <span class="new-price">₹499</span>
                </div>
                <a href="#" class="buy-btn">ORDER ON WHATSAPP</a>
            </div>
        </div>

        <div class="product-card">
            <span class="product-tag">NEW ARRIVAL</span>
            <img src="https://i.ibb.co/3W6M4qN/1000260595.jpg" alt="Gemstone Mosaic">
            <div class="product-details">
                <h3 class="product-title">Gemstone Mosaic</h3>
                <div class="price-box">
                    <span class="old-price">₹599</span>
                    <span class="new-price">₹499</span>
                </div>
                <a href="#" class="buy-btn">ORDER ON WHATSAPP</a>
            </div>
        </div>

        <div class="product-card">
            <span class="product-tag">LUXURY</span>
            <img src="https://i.ibb.co/N1R0D6L/1000260607.jpg" alt="Dual Heart Lariat">
            <div class="product-details">
                <h3 class="product-title">Dual Heart Lariat</h3>
                <div class="price-box">
                    <span class="old-price">₹799</span>
                    <span class="new-price">₹699</span>
                </div>
                <a href="#" class="buy-btn">ORDER ON WHATSAPP</a>
            </div>
        </div>

    </div>
</div>

</body>
</html>

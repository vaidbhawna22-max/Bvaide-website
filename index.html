<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVAIDE | Necklaces Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --gold: #bca05d;
            --navy: #001f3f;
            --cream: #faf8f5;
            --light: #f4f1ec;
            --text: #1a1a1a;
            --muted: #888;
        }

        body {
            font-family: 'Jost', sans-serif;
            background: var(--cream);
            color: var(--text);
            min-height: 100vh;
        }

        /* HEADER */
        header {
            background: #fff;
            padding: 18px 20px;
            text-align: center;
            border-bottom: 1px solid #ede8e0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 4px;
            color: var(--navy);
            text-transform: uppercase;
        }
        .logo .bv { color: var(--navy); font-weight: 300; font-style: italic; }
        .logo .aide { color: var(--gold); font-weight: 600; letter-spacing: 3px; }
        .logo span {
            color: var(--gold);
        }

        /* NAV */
        nav.main-menu {
            display: flex;
            justify-content: center;
            gap: 0;
            background: #fff;
            border-bottom: 1px solid #ede8e0;
            overflow-x: auto;
        }
        nav.main-menu a {
            text-decoration: none;
            color: var(--muted);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 14px 20px;
            border-bottom: 2px solid transparent;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        nav.main-menu a:hover {
            color: var(--navy);
        }
        nav.main-menu a.active {
            color: var(--navy);
            border-bottom: 2px solid var(--gold);
        }

        /* PAGE SECTIONS */
        .page-section { display: none; }
        .page-section.active { display: block; }

        /* HERO BANNER */
        .category-header {
            background: var(--light);
            text-align: center;
            padding: 35px 20px 30px;
            border-bottom: 1px solid #ede8e0;
        }
        .category-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 6px;
            color: var(--navy);
            text-transform: uppercase;
        }
        .category-header p {
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .gold-line {
            width: 40px;
            height: 1px;
            background: var(--gold);
            margin: 14px auto 0;
        }

        /* PRODUCT GRID */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px 15px 50px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        @media (min-width: 768px) {
            .product-grid { grid-template-columns: repeat(3, 1fr); gap: 35px; }
        }

        /* PRODUCT CARD */
        .product-card {
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
        }
        .img-wrap {
            position: relative;
            overflow: hidden;
        }
        .product-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            object-position: center top;
            display: block;
            transition: transform 0.5s ease;
        }
        .product-card:hover img {
            transform: scale(1.04);
        }

        .product-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--navy);
            color: #fff;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 2px;
        }
        .product-tag.gold {
            background: var(--gold);
        }

        .product-details {
            padding: 14px 12px 16px;
        }
        .product-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            font-weight: 400;
            color: var(--navy);
            margin-bottom: 6px;
        }
        .price-box {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .old-price {
            text-decoration: line-through;
            color: #bbb;
            font-size: 12px;
        }
        .new-price {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .buy-btn {
            display: block;
            width: 100%;
            background: var(--navy);
            color: #fff;
            text-align: center;
            padding: 10px 0;
            text-decoration: none;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 2px;
            transition: background 0.25s ease;
        }
        .buy-btn:hover {
            background: var(--gold);
        }

        /* COMING SOON PAGE */
        .coming-soon {
            text-align: center;
            padding: 80px 20px;
        }
        .coming-soon h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 4px;
            color: var(--navy);
            text-transform: uppercase;
        }
        .coming-soon p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 12px;
            letter-spacing: 1px;
        }

        /* FOOTER */
        footer {
            background: var(--navy);
            color: #fff;
            text-align: center;
            padding: 25px 20px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.9;
        }
    </style>
</head>

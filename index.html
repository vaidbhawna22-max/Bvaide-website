<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bvaide Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #fcfcfc; margin: 0; padding: 10px; }
        .bvaide-container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        
        /* Category Header/DP Style */
        .category-header {
            width: 100%;
            height: 350px;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.3)), url('https://image_1.png'); /* Necklace Photo as DP */
            background-size: cover;
            background-position: center;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-bottom: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .category-header h1 { font-size: 2.8rem; text-transform: uppercase; letter-spacing: 3px; font-weight: 600; text-shadow: 2px 2px 15px rgba(0,0,0,0.6); }
        
        /* Section Titles */
        .section-title { font-size: 2.2rem; color: #222; margin: 60px 0 30px; border-left: 6px solid #d4af37; padding-left: 20px; font-weight: 600; }
        
        /* Grid System */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        /* Product Card Styling */
        .bvaide-card {
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            transition: 0.4s ease;
            border: 1px solid #f0f0f0;
            text-align: center;
            display: flex;
            flex-direction: column;
        }
        .bvaide-card:hover { transform: translateY(-12px); box-shadow: 0 15px 35px rgba(0,0,0,0.12); border-color: #d4af37; }
        
        .img-container { width: 100%; height: 350px; overflow: hidden; position: relative; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .bvaide-card:hover .img-container img { transform: scale(1.05); }
        
        /* Discount Tag */
        .discount-tag { position: absolute; top: 15px; left: 15px; background: #27ae60; color: white; padding: 5px 12px; border-radius: 50px; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; }

        .p-info { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .p-cat { text-transform: uppercase; color: #aaa; font-size: 0.75rem; letter-spacing: 2px; margin-bottom: 8px; display: block; }
        .p-title { font-size: 1.4rem; font-weight: 600; color: #333; margin: 0 0 15px; line-height: 1.3; }
        .p-price { margin-bottom: 25px; }
        .old-p { text-decoration: line-through; color: #bbb; margin-right: 12px; font-size: 1.1rem; }
        .new-p { color: #d4af37; font-weight: bold; font-size: 1.5rem; }
        
        .buy-btn {
            background: #222; color: #fff; border: none; padding: 15px 25px;
            width: 100%; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 1rem; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .buy-btn:hover { background: #d4af37; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3); }

        /* Footer Quote */
        .bvaide-footer-quote { text-align: center; margin-top: 80px; color: #888; font-style: italic; border-top: 1px solid #eee; padding-top: 30px; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .category-header { height: 250px; margin-bottom: 30px; }
            .category-header h1 { font-size: 1.8rem; }
            .section-title { font-size: 1.8rem; margin: 40px 0 20px; }
            .product-grid { grid-template-columns: 1fr; gap: 20px; }
            .img-container { height: 300px; }
        }
    </style>
</head>
<body>

<div class="bvaide-container">
    
    <div class="category-header">
        <h1>NECKLACE COLLECTION</h1>
    </div>

    <div class="product-grid">
        <div class="bvaide-card">
            <div class="img-container">
                <span class="discount-tag">SPECIAL OFFER</span>
                <img src="https://image_1.png" alt="Sleek Necklace">
            </div>
            <div class="p-info">
                <div>
                    <span class="p-cat">Women's Minimalist Collection</span>
                    <div class="p-title">The Golden Minimalist Sleek Chain</div>
                </div>
                <div>
                    <div class="p-price">
                        <span class="old-p">₹499</span>
                        <span class="new-p">₹399</span>
                    </div>
                    <button class="buy-btn">Abhi Order Karein</button>
                </div>
            </div>
        </div>
        
        </div>

    <h2 class="section-title">Men's Premium Wear</h2>
    
    <div class="product-grid">
        <div class="bvaide-card">
            <div class="img-container">
                <img src="https://image_0.png" alt="Mens Bracelet">
            </div>
            <div class="p-info">
                <div>
                    <span class="p-cat">Men's Fine Jewelry</span>
                    <div class="p-title">The Executive Gold-Link Bracelet</div>
                </div>
                <div>
                    <div class="p-price">
                        <span class="old-p">₹699</span>
                        <span class="new-p">₹599</span>
                    </div>
                    <button class="buy-btn">Bag Mein Dalein</button>
                </div>
            </div>
        </div>
    </div>

    <p class="bvaide-footer-quote">
        "Bvaide: Jahan har piece ki apni ek kahani hai, aur har khareed ek naya rishta."
    </p>

</div>

</body>
            </html>
